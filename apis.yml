  description: Create video records within a project, upload source files, list and
    filter the content library, and retrieve per-video information including the HLS
    primary playback URL. Uploads use the ByteArk Stream Video Upload SDK or direct
    form-data / resumable upload endpoints.
- aid: bytark:bytark-live-streaming-api
  name: ByteArk Live Streaming API
  tags:
  - Live Streaming
  - Transcoding
  - RTMP
  - Media
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.byteark.com/en/fleet-streaming/live-api-transcoder.html
