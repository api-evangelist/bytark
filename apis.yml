name: ByteArk
kind: company
description: ByteArk is a Thailand-based video streaming and content delivery platform
  founded in 2012 and headquartered in Bangkok. It provides video-on-demand (ByteArk
  Stream), live streaming (Fleet / Teatro), an S3-compatible object storage service,
  a global CDN, and a pre-configured web/mobile video player with DRM content protection.
  Developers integrate through REST APIs authenticated with personal access tokens
  and S3-compatible credentials.
