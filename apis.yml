  - url: collections/bytark.postman_collection.json
    type: PostmanCollection
  - url: collections/bytark.opencollection.json
    type: OpenCollection
  description: S3-compatible object storage for storing and distributing files. Works
    with standard S3 SDKs and tooling (bucket and object operations - put, get, list,
    delete) using access-key / secret-key credentials. Tiered by redundancy (Basic,
    Standard, Extra Redundancy).
