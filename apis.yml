    type: Documentation
  - url: https://docs.byteark.com/en/fleet-streaming/live-api-transcoder.html
    type: APIReference
  - url: openapi/bytark-openapi.yml
    type: OpenAPI
  - url: collections/bytark.postman_collection.json
    type: PostmanCollection
  - url: collections/bytark.opencollection.json
    type: OpenCollection
  description: Fleet live transcode API to create, list, and delete live streaming
    channels. Returns an RTMP publish endpoint and stream key for ingest, an HLS
    (index.m3u8) viewing URL, and per-resolution transcode profiles. Also supports
    dropping a publisher and resetting the transcoder.
