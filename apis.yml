    type: OpenAPI
  - url: collections/bytark.postman_collection.json
    type: PostmanCollection
  - url: collections/bytark.opencollection.json
    type: OpenCollection
  description: Pre-configured HTML5 video player with framework packages for React,
    Vue, and Angular. Renders HLS playback with DRM content protection (including
    WisePlay), signed-URL access, and player-settings configuration surfaced through
    the Stream player settings.
